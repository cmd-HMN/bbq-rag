name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (Rust + Python)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Setup Rust toolchain
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 3. Cache Rust dependencies for fast builds
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 4. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # 5. Run Rust Cargo Tests
      - name: Run Cargo Tests
        run: |
          cargo test --verbose

      # 6. Install Python build tools and dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install maturin numpy pytest httpx pillow pyyaml requests fastapi uvicorn

      # 7. Build and install BBQ package via pip
      - name: Build and install BBQ (Release)
        run: |
          pip install .

      # 8. Check BBQ version and CLI
      - name: Verify BBQ version and CLI
        run: |
          python -c "
          import bbq
          version = getattr(bbq, '__version__', 'N/A')
          print('=' * 50)
          print(f'BBQ Version: {version}')
          print('=' * 50)
          assert version != 'N/A'
          "
          bbq --version

      # 9. Run Python unit tests
      - name: Run Pytest test suite
        env:
          CI: "true"
        run: |
          pytest

