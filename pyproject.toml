[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "bbq-rag"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python",
]

dependencies = [
    "pymupdf",
    "watchdog",
    "rich",
]
dynamic = ["version"]

[project.optional-dependencies]
benchmark = [
  "tqdm>=4.66.0",
  "matplotlib>=3.8.0",
  "jinja2>=3.1.0",
  "datasets>=2.14.0",
  "plotly>=5.18.0",
]
dev = ["pytest>=9.1.1"]

[dependency-groups]
dev = ["pytest>=9.1.1"]
benchmark = [
  "tqdm>=4.66.0",
  "matplotlib>=3.8.0",
  "jinja2>=3.1.0",
  "datasets>=2.14.0",
  "plotly>=5.18.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.maturin]
module-name = "maxsimd"
python-source = "bbq"

[tool.pyright]
extraPaths = ["bbq"]
